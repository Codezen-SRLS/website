# Unit tests run on every push and PR.
# Deploy runs only when a commit lands on main (after a PR merge): it builds the site,
# runs the end-to-end suite against it, then publishes a fresh production build.

name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Secret names are unchanged from the Gatsby site; astro.config.ts exposes these prefixes
env:
  GA_TRACKING_ID: ${{ secrets.GA_TRACKING_ID }}
  GATSBY_CLARITY_ID: ${{ secrets.CLARITY_ID }}
  GATSBY_EMAILJS_SERVICE_ID: ${{ secrets.GATSBY_EMAILJS_SERVICE_ID }}
  GATSBY_EMAILJS_TEMPLATE_ID: ${{ secrets.GATSBY_EMAILJS_TEMPLATE_ID }}
  GATSBY_EMAILJS_PUBLIC_KEY: ${{ secrets.GATSBY_EMAILJS_PUBLIC_KEY }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PAT }}
          # Full history (site and audit-history) dates each page's sitemap lastmod
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds with dummy analytics/EmailJS IDs (see playwright.config.ts) and intercepts third parties
      - run: npm run test:e2e
      # Rebuild with the real IDs for publishing
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: www.codezen.tech

# Keeps the audit-history submodule (src/sharedData) up to date.
# Triggered by audit-history after every data update (repository_dispatch), daily as a fallback,
# or by hand. When audit-history has new commits it moves the submodule, checks that the site
# still tests and builds, then commits the bump to main. That push (made with the PAT, so it
# triggers workflows) runs the Node.js CI workflow, which deploys.

name: Update audit-history

on:
  repository_dispatch:
    types: [audit-history-updated]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: update-audit-history
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PAT }}

      - name: Move src/sharedData to the latest audit-history
        id: bump
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          # The submodule URL is SSH; fetch it over HTTPS with the PAT (audit-history is private)
          git config --global url."https://x-access-token:${PAT}@github.com/".insteadOf "git@github.com:"
          git submodule update --remote src/sharedData
          if git diff --quiet -- src/sharedData; then
            echo "audit-history is already up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git -C src/sharedData rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "subject=$(git -C src/sharedData log -1 --format=%s)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.bump.outputs.changed == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      # The build fails on missing/malformed/duplicate slugs and missing logos (src/lib)
      - name: Test and build with the new data
        if: steps.bump.outputs.changed == 'true'
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit and push the bump
        if: steps.bump.outputs.changed == 'true'
        env:
          SHA: ${{ steps.bump.outputs.sha }}
          SUBJECT: ${{ steps.bump.outputs.subject }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src/sharedData
          git commit -m "chore: update audit-history to ${SHA}" -m "audit-history: ${SUBJECT}"
          git pull --rebase origin main
          git push origin HEAD:main
